<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cupya.me</title>

  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:       #16161e;
      --elevated: #1e1e28;
      --surface:  #252530;
      --line:     #2e2e3a;
      --line-em:  #3a3a48;
      --label:    #f0f0f2;
      --label-n:  #bfbfcf;
      --label-a:  #9494a6;
      --label-d:  #7c7c8b;
      --primary:  #d8f050;
      --pri-text: #1a1f08;
    }

    :root.light {
      --bg:       #f5f5f0;
      --elevated: #ffffff;
      --surface:  #ebebeb;
      --line:     #ddddd8;
      --line-em:  #cccccc;
      --label:    #111118;
      --label-n:  #505060;
      --label-a:  #6c6c76;
      --label-d:  #909098;
      --primary:  #5a7a00;
      --pri-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--label);
      font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2rem;
    }

    .header {
      margin-bottom: 3.5rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .wordmark {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .tagline {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
      color: var(--label-d);
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .theme-btn {
      margin-top: 2px;
      padding: 3px 8px;
      border: 0.5px solid var(--line-em);
      border-radius: 3px;
      background: none;
      color: var(--label-d);
      cursor: pointer;
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      transition: color 0.15s, border-color 0.15s;
    }

    .theme-btn:hover {
      color: var(--label-a);
      border-color: var(--label-d);
    }

    .section-label {
      margin-bottom: 0.6rem;
      color: var(--label-d);
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .app-list {
      list-style: none;
    }

    .app-item {
      border-top: 0.5px solid var(--line);
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.3s ease forwards;
    }

    .app-item:nth-child(1) {
      animation-delay: 0.05s;
    }

    .app-item:nth-child(2) {
      animation-delay: 0.12s;
    }

    .app-item:last-child {
      border-bottom: 0.5px solid var(--line);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-link {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      margin: 0 -0.5rem;
      padding: 0.95rem 0.5rem;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.12s;
    }

    .app-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }

    .app-name {
      width: fit-content;
      color: var(--label);
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: color 0.12s, transform 0.12s;
    }

    .app-desc {
      width: fit-content;
      color: var(--label-a);
      font-size: 12px;
      line-height: 1.5;
      transition: color 0.12s, transform 0.12s;
    }

    .app-url {
      color: var(--label-d);
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
      white-space: nowrap;
      transition: color 0.12s, transform 0.12s;
    }

    .app-url::after {
      content: ' ↗';
      font-size: 10px;
      opacity: 0;
      transition: opacity 0.12s;
    }

    .app-link:hover .app-name {
      color: var(--primary);
      transform: translateX(-2px);
    }

    .app-link:hover .app-desc {
      color: var(--label-n);
      transform: translateX(-1px);
    }

    .app-link:hover .app-url {
      color: var(--primary);
      transform: translateX(2px);
    }

    .app-link:hover .app-url::after {
      opacity: 1;
    }

    footer {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 0.5px solid var(--line);
    }

    .mail-link {
      display: inline-flex;
      align-items: baseline;
      gap: 0.45rem;
      color: var(--label-d);
      text-decoration: none;
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.02em;
      transition: color 0.12s;
    }

    .mail-link:hover {
      color: var(--primary);
    }

    .mail-label {
      color: var(--label-d);
      font-style: italic;
    }

    .mail-address {
      color: inherit;
    }

    .mail-link::after {
      content: '↗';
      color: inherit;
      font-size: 10px;
      opacity: 0;
      transform: translateX(-2px);
      transition: opacity 0.12s, transform 0.12s;
    }

    .mail-link:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    .footer-meta {
      color: var(--label-d);
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
    }

    @media (max-width: 420px) {
      main {
        padding-top: 3rem;
      }

      .header {
        margin-bottom: 3rem;
      }

      .app-link {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }

      .app-url {
        font-size: 10px;
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.45rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="header">
      <div class="header-left">
        <span class="wordmark">cupya.me</span>
        <span class="tagline">welcome!</span>
      </div>

      <button class="theme-btn" id="themeBtn" type="button">light</button>
    </div>

    <p class="section-label">apps</p>

    <ul class="app-list">
      <li class="app-item">
        <a class="app-link" href="https://cp.cupya.me" target="_blank" rel="noreferrer">
          <div class="app-main">
            <span class="app-name">crop.playshare</span>
            <span class="app-desc">팝픈뮤직 플레이셰어 스크린샷 자르기</span>
          </div>

          <span class="app-url">cp.cupya.me</span>
        </a>
      </li>

      <li class="app-item">
        <a class="app-link" href="https://al.cupya.me" target="_blank" rel="noreferrer">
          <div class="app-main">
            <span class="app-name">arcade@live</span>
            <span class="app-desc">오락실 게임 방송 모아보기</span>
          </div>

          <span class="app-url">al.cupya.me</span>
        </a>
      </li>

      <li class="app-item">
        <a class="app-link" href="https://oj.cupya.me" target="_blank" rel="noreferrer">
          <div class="app-main">
            <span class="app-name">CPOJ</span>
            <span class="app-desc">인-브라우저 알고리즘 문제 온라인 저지</span>
          </div>

          <span class="app-url">oj.cupya.me</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <a href="#" class="mail-link" id="mailLink" aria-label="Send mail">
      <span class="mail-label">contact —</span>
      <span class="mail-address">me<span data-at></span>cupya.me</span>
    </a>

    <span class="footer-meta">2 apps</span>
  </footer>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    const root = document.documentElement;

    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let isLight = saved ? saved === 'light' : !prefersDark;

    function applyTheme() {
      root.classList.toggle('light', isLight);
      themeBtn.textContent = isLight ? 'dark' : 'light';
    }

    applyTheme();

    themeBtn.onclick = () => {
      isLight = !isLight;
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      applyTheme();
    };

    const user = 'me';
    const domain = 'cupya.me';
    const address = `${user}@${domain}`;

    const mailLink = document.getElementById('mailLink');
    mailLink.href = `mailto:${address}`;
    mailLink.querySelector('[data-at]').textContent = '@';
  </script>
</body>
</html>
