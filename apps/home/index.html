<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cupya.me</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #16161e;
      --elevated: #1e1e28;
      --surface:  #252530;
      --line:     #2e2e3a;
      --line-em:  #3a3a48;
      --label:    #f0f0f2;
      --label-n:  #bfbfcf;
      --label-a:  #9494a6;
      --label-d:  #7c7c8b;
      --primary:  #d8f050;
      --pri-text: #1a1f08;
    }
    :root.light {
      --bg:       #f5f5f0;
      --elevated: #ffffff;
      --surface:  #ebebeb;
      --line:     #ddddd8;
      --line-em:  #cccccc;
      --label:    #111118;
      --label-n:  #505060;
      --label-a:  #6c6c76;
      --label-d:  #909098;
      --primary:  #5a7a00;
      --pri-text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--label);
      font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      padding: 3.5rem 1.5rem 2rem;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 3.5rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-left { display: flex; flex-direction: column; gap: 0.35rem; }

    .wordmark {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--label);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .wordmark { color: var(--primary); }

    .tagline {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
      color: var(--label-d);
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .theme-btn {
      background: none;
      border: 0.5px solid var(--line-em);
      cursor: pointer;
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 10px;
      color: var(--label-d);
      padding: 3px 8px;
      border-radius: 3px;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }
    .theme-btn:hover { color: var(--label-a); border-color: var(--label-d); }

    .section-label {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 10px;
      color: var(--label-d);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .app-list { list-style: none; }

    .app-item {
      border-top: 0.5px solid var(--line);
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.3s ease forwards;
    }
    .app-item:nth-child(1) { animation-delay: 0.05s; }
    .app-item:nth-child(2) { animation-delay: 0.12s; }
    .app-item:nth-child(3) { animation-delay: 0.19s; }
    .app-item:nth-child(4) { animation-delay: 0.26s; }
    .app-item:last-child { border-bottom: 0.5px solid var(--line); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .app-link {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.8rem 0.5rem;
      text-decoration: none;
      border-radius: 4px;
      margin: 0 -0.5rem;
      transition: background 0.12s;
      position: relative;
    }
    .app-link::after {
      content: '↗';
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%) scale(0.8);
      font-size: 13px;
      color: var(--label-d);
      opacity: 0;
      transition: opacity 0.12s, transform 0.12s;
    }
    .app-link:hover { background: var(--surface); }
    .app-link:hover::after { opacity: 1; transform: translateY(-50%) scale(1); }
    .app-link:hover .app-url { color: var(--primary); }

    .app-row-top {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }

    .app-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--label);
      letter-spacing: -0.2px;
    }

    .app-url {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
      color: var(--label-d);
      transition: color 0.12s;
    }

    .app-desc {
      font-size: 12px;
      color: var(--label-a);
      line-height: 1.5;
      padding-right: 1.5rem;
    }

    footer {
      padding: 1.25rem 1.5rem;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 0.5px solid var(--line);
    }

    .footer-nick {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
      color: var(--label-d);
      letter-spacing: 0.02em;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .footer-nick .tilde { color: var(--primary); }
    .footer-nick a {
      color: var(--label-d);
      text-decoration: none;
      transition: color 0.12s;
    }
    .footer-nick a:hover { color: var(--label-a); }

    .footer-count {
      font-family: 'Ubuntu Sans Mono', monospace;
      font-size: 11px;
      color: var(--label-d);
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div class="header-left">
        <span class="wordmark">cupya.me</span></span>
        <span class="tagline">welcome!</span>
      </div>
      <button class="theme-btn" id="themeBtn">light</button>
    </div>

    <p class="section-label">apps</p>
    <ul class="app-list">
      <li class="app-item">
        <a class="app-link" href="https://cp.cupya.me" target="_blank">
          <div class="app-row-top">
            <span class="app-name">crop.playshare</span>
            <span class="app-url">cp.cupya.me</span>
          </div>
          <span class="app-desc">팝픈뮤직 플레이셰어 스크린샷 자르기</span>
        </a>
      </li>
      <li class="app-item">
        <a class="app-link" href="https://al.cupya.me" target="_blank">
          <div class="app-row-top">
            <span class="app-name">arcade@live</span>
            <span class="app-url">al.cupya.me</span>
          </div>
          <span class="app-desc">오락실 게임 방송 모아보기</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <span class="footer-nick">ｃｕｐｙａ<span class="tilde">～</span> <a href="https://x.com/ringanaku" target="_blank">@ringanaku</a></span>
    <span class="footer-count" id="footerCount"></span>
  </footer>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    const root = document.documentElement;

    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let isLight = saved ? saved === 'light' : !prefersDark;

    function applyTheme() {
      root.classList.toggle('light', isLight);
      themeBtn.textContent = isLight ? 'dark' : 'light';
    }
    applyTheme();

    themeBtn.onclick = () => {
      isLight = !isLight;
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      applyTheme();
    };

    document.getElementById('footerCount').textContent =
      document.querySelectorAll('.app-item').length + ' apps';
  </script>
</body>
</html>
